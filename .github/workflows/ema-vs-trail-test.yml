name: ema-vs-trail-test

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install numpy

      - name: Cache Binance 15m data
        uses: actions/cache@v4
        with:
          path: data_tt
          key: tt-15m-${{ github.run_id }}
          restore-keys: |
            tt-15m-

      - name: Run
        run: python ema_vs_trail_test.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ema-vs-trail-report
          path: ema_vs_trail_report.txt
