name: grid-so-test

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install numpy

      - name: Cache BTC data
        uses: actions/cache@v4
        with:
          path: data_btc
          key: btc-5m-${{ github.run_id }}
          restore-keys: |
            btc-5m-

      - name: Run
        run: python grid_so_test.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grid-so-report
          path: grid_so_report.txt
