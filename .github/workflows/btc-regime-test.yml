name: btc-regime-test

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install numpy

      - name: Cache Binance 15m data
        uses: actions/cache@v4
        with:
          path: data_tt
          key: tt-15m-${{ github.run_id }}
          restore-keys: |
            tt-15m-

      - name: Run
        env:
          # третий набор: 38 крупных монет с историей на Binance с 2021 года или раньше,
          # ни одна не участвовала в прошлых тестах
          NEW: "SHIB,HBAR,ICP,FET,INJ,GRT,STX,RUNE,EGLD,AXS,THETA,SAND,MANA,CHZ,KAVA,NEO,DASH,ZIL,QTUM,BAT,ICX,ENJ,CRV,COMP,SNX,1INCH,SUSHI,YFI,CAKE,ONE,IOTA,IOTX,ROSE,KSM,FLOW,GALA,LRC,ANKR"
        run: python btc_regime_test.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-regime-report
          path: btc_regime_report.txt
